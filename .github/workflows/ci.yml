name: EnterpriseFlow checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run business, MCP, LangGraph, and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Verify bundled fixtures match source data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          source = root / "data" / "demo_seed.json"
          packed = root / "src" / "enterprise_flow" / "data" / "demo_seed.json"
          assert source.read_bytes() == packed.read_bytes(), "Source/package fixture drift"
          print("Bundled fixture matches source data")
          PY
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import http.cookiejar
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request
          import venv
          import zipfile

          repository = Path.cwd()
          wheel = next((repository / "dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              package_root = repository / "src" / "enterprise_flow"
              for source in package_root.rglob("*"):
                  if source.is_file() and source.suffix in {".py", ".json"}:
                      member = "enterprise_flow/" + source.relative_to(package_root).as_posix()
                      assert archive.read(member) == source.read_bytes(), "Wheel source mismatch: " + member
          with tempfile.TemporaryDirectory() as folder:
              temporary = Path(folder)
              environment = temporary / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              interpreter = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(interpreter), "-m", "pip", "install", "-r", str(repository / "requirements.lock.txt"), str(wheel)], check=True)
              command = [str(interpreter), "-m", "enterprise_flow"]
              subprocess.run(command + ["--help"], cwd=temporary, check=True)
              subprocess.run(command + ["doctor", "--mode", "fixture"], cwd=temporary, check=True)
              database = temporary / "business.sqlite"
              demonstration = subprocess.run(command + ["demo", "--db", str(database), "--mode", "fixture"], cwd=temporary, check=True, capture_output=True, text=True, encoding="utf-8")
              report = json.loads(demonstration.stdout)
              assert report["final_status"] == "submitted"
              assert report["checkpoint_restored"] is True
              assert report["repeated_resume_same_submission"] is True
              assert report["model_used"] is False
              assert report["eligible_cents"] == 123000 and report["excess_cents"] == 6000
              print(json.dumps(report, indent=2))
              process = subprocess.Popen(command + ["serve", "--db", str(database), "--mode", "fixture", "--port", "7861"], cwd=temporary, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              try:
                  ready = False
                  for attempt in range(60):
                      if process.poll() is not None:
                          raise RuntimeError(process.stderr.read().decode("utf-8", errors="replace"))
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:7861/health", timeout=1) as response:
                              assert response.status == 200
                              ready = True
                              break
                      except (urllib.error.URLError, TimeoutError):
                          time.sleep(0.25)
                  assert ready, "Installed wheel HTTP server did not start"
                  with urllib.request.urlopen("http://127.0.0.1:7861/", timeout=3) as response:
                      html = response.read().decode("utf-8")
                      assert response.status == 200 and "EnterpriseFlow" in html
                  with urllib.request.urlopen("http://127.0.0.1:7861/api/demo-users", timeout=3) as response:
                      assert response.status == 200
                      assert b"alice" in response.read()
                  opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                  def post(path, payload):
                      request = urllib.request.Request("http://127.0.0.1:7861" + path, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json", "Origin": "http://127.0.0.1:7861"}, method="POST")
                      with opener.open(request, timeout=10) as response:
                          return json.loads(response.read().decode("utf-8"))
                  assert post("/api/login", {"user_id": "alice"})["user_id"] == "alice"
                  answer = post("/api/policy-answers", {"question": "广州住宿标准", "trip_date": "2026-10-09"})
                  assert answer["status"] == "source_preview" and answer["model_used"] is False
                  assert answer["sources"] and answer["citations"]
                  assert all(source["tenant_id"] == "alpha" for source in answer["sources"])
                  print("Installed wheel fixture demo, live HTTP and authorized policy QA smoke passed")
              finally:
                  process.terminate()
                  process.wait(timeout=10)
          PY
