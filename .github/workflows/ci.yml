name: EnterpriseFlow checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock.txt
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e ".[dev,retrieval,api]"
          python -m pip check
      - name: Run business, MCP, LangGraph, retrieval, and API tests
        run: python -m unittest discover -s tests -v
      - name: Verify bundled fixtures match source data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          source = root / "data" / "demo_seed.json"
          packed = root / "src" / "enterprise_flow" / "data" / "demo_seed.json"
          assert source.read_bytes() == packed.read_bytes(), "Source/package fixture drift"
          print("Bundled fixture matches source data")
          PY
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import http.cookiejar
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request
          import venv
          import zipfile

          repository = Path.cwd()
          wheel = next((repository / "dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              package_root = repository / "src" / "enterprise_flow"
              for source in package_root.rglob("*"):
                  if source.is_file() and source.suffix in {".py", ".json"}:
                      member = "enterprise_flow/" + source.relative_to(package_root).as_posix()
                      assert archive.read(member) == source.read_bytes(), "Wheel source mismatch: " + member
          with tempfile.TemporaryDirectory() as folder:
              temporary = Path(folder)
              environment = temporary / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              interpreter = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(interpreter), "-m", "pip", "install", "-r", str(repository / "requirements.lock.txt"), str(wheel)], check=True)
              subprocess.run([str(interpreter), "-m", "pip", "install", ".[api]"], cwd=repository, check=True)
              command = [str(interpreter), "-m", "enterprise_flow"]
              subprocess.run(command + ["--help"], cwd=temporary, check=True)
              subprocess.run(command + ["doctor", "--mode", "fixture"], cwd=temporary, check=True)
              database = temporary / "business.sqlite"
              demonstration = subprocess.run(command + ["demo", "--db", str(database), "--mode", "fixture"], cwd=temporary, check=True, capture_output=True, text=True, encoding="utf-8")
              report = json.loads(demonstration.stdout)
              assert report["final_status"] == "submitted"
              assert report["checkpoint_restored"] is True
              assert report["repeated_resume_same_submission"] is True
              assert report["model_used"] is False
              assert report["eligible_cents"] == 123000 and report["excess_cents"] == 6000
              print(json.dumps(report, indent=2))
              agent_database = temporary / "agent.sqlite"
              task = json.dumps({"order_ids": ["alice-hotel-001", "alice-train-001"], "cost_center": "CC-ALPHA-OPS", "start_date": "2026-10-09", "end_date": "2026-10-11"})
              planning = subprocess.run(command + ["plan", "--db", str(agent_database), "--mode", "fixture", "--message", task], cwd=temporary, check=True, capture_output=True, text=True, encoding="utf-8")
              plan_report = json.loads(planning.stdout)["plan"]
              assert plan_report["stop_reason"] == "goal_satisfied", plan_report
              assert plan_report["tool_calls"] == 3 and plan_report["blocked_tools"] == []
              assert plan_report["read_only"] is True and plan_report["business_effects"] is False
              assert plan_report["findings"]["calculate_expense"]["eligible_cents"] == 123000
              collaboration = subprocess.run(command + ["collaborate", "--db", str(agent_database), "--mode", "fixture", "--message", task], cwd=temporary, check=True, capture_output=True, text=True, encoding="utf-8")
              collaboration_report = json.loads(collaboration.stdout)
              proposal = collaboration_report["proposal"]
              assert proposal["roles"] == ["order_reconciler", "policy_researcher", "cost_estimator"]
              assert proposal["blocked"] is False and proposal["conflicts"] == []
              assert proposal["requires_human_confirmation"] is True and proposal["business_effects"] is False
              assert collaboration_report["draft_count_after_analysis"] == 0
              print("Installed wheel read-only planning and multi-agent analysis created no business writes")
              process = subprocess.Popen(command + ["serve", "--db", str(database), "--mode", "fixture", "--port", "7861"], cwd=temporary, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              try:
                  ready = False
                  for attempt in range(60):
                      if process.poll() is not None:
                          raise RuntimeError(process.stderr.read().decode("utf-8", errors="replace"))
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:7861/health", timeout=1) as response:
                              assert response.status == 200
                              ready = True
                              break
                      except (urllib.error.URLError, TimeoutError):
                          time.sleep(0.25)
                  assert ready, "Installed wheel HTTP server did not start"
                  with urllib.request.urlopen("http://127.0.0.1:7861/", timeout=3) as response:
                      html = response.read().decode("utf-8")
                      assert response.status == 200 and "EnterpriseFlow" in html
                  with urllib.request.urlopen("http://127.0.0.1:7861/api/demo-users", timeout=3) as response:
                      assert response.status == 200
                      assert b"alice" in response.read()
                  opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                  def post(path, payload):
                      request = urllib.request.Request("http://127.0.0.1:7861" + path, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json", "Origin": "http://127.0.0.1:7861"}, method="POST")
                      with opener.open(request, timeout=10) as response:
                          return json.loads(response.read().decode("utf-8"))
                  assert post("/api/login", {"user_id": "alice"})["user_id"] == "alice"
                  answer = post("/api/policy-answers", {"question": "广州住宿标准", "trip_date": "2026-10-09"})
                  assert answer["status"] == "source_preview" and answer["model_used"] is False
                  assert answer["sources"] and answer["citations"]
                  assert all(source["tenant_id"] == "alpha" for source in answer["sources"])
                  def draft_count():
                      with opener.open("http://127.0.0.1:7861/api/drafts", timeout=5) as response:
                          return len(json.loads(response.read().decode("utf-8")))
                  drafts_before = draft_count()
                  task = json.dumps({"order_ids": ["alice-hotel-001", "alice-train-001"], "cost_center": "CC-ALPHA-OPS", "start_date": "2026-10-09", "end_date": "2026-10-11"})
                  proposal = post("/api/agent-proposals", {"message": task})
                  assert proposal["read_only"] is True and proposal["business_effects"] is False
                  assert proposal["requires_human_confirmation"] is True and proposal["blocked"] is False
                  plan = post("/api/plan", {"message": task})
                  assert plan["stop_reason"] == "goal_satisfied" and plan["tool_calls"] == 3
                  assert plan["read_only"] is True and plan["business_effects"] is False
                  assert draft_count() == drafts_before, "The agent layer must not create drafts"
                  print("Installed wheel fixture demo, live HTTP, authorized policy QA and read-only agent layer smoke passed")
              finally:
                  process.terminate()
                  process.wait(timeout=10)

              api_database = temporary / "api.sqlite"
              api_process = subprocess.Popen(command + ["serve-api", "--db", str(api_database), "--port", "8001"], cwd=temporary, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              try:
                  ready = False
                  for attempt in range(80):
                      if api_process.poll() is not None:
                          raise RuntimeError(api_process.stderr.read().decode("utf-8", errors="replace"))
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=1) as response:
                              assert json.loads(response.read())["status"] == "ok"
                              ready = True
                              break
                      except (urllib.error.URLError, TimeoutError):
                          time.sleep(0.25)
                  assert ready, "Installed wheel API service did not start"
                  with urllib.request.urlopen("http://127.0.0.1:8001/openapi.json", timeout=5) as response:
                      contract = json.loads(response.read())
                  assert sorted(contract["paths"]) == ["/health", "/orders", "/policies", "/traces/{run_id}", "/workflows", "/workflows/{run_id}", "/workflows/{run_id}/resume"]

                  def api_get(path, expected=200):
                      opener_local = urllib.request.build_opener()
                      try:
                          with opener_local.open("http://127.0.0.1:8001" + path, timeout=10) as response:
                              assert response.status == expected, path
                              return json.loads(response.read())
                      except urllib.error.HTTPError as error:
                          assert error.code == expected, (path, error.code)
                          return json.loads(error.read())

                  def api_post(path, payload, expected=200):
                      request = urllib.request.Request("http://127.0.0.1:8001" + path, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"}, method="POST")
                      opener_local = urllib.request.build_opener()
                      try:
                          with opener_local.open(request, timeout=30) as response:
                              assert response.status == expected, path
                              return json.loads(response.read())
                      except urllib.error.HTTPError as error:
                          assert error.code == expected, (path, error.code)
                          return json.loads(error.read())

                  # Tenant isolation has to hold over HTTP exactly as it does in-process.
                  alpha = api_get("/policies?user_id=bob&query=%E4%BD%8F%E5%AE%BF")
                  beta = api_get("/policies?user_id=diana&query=%E4%BD%8F%E5%AE%BF")
                  assert alpha["items"] and {row["tenant_id"] for row in alpha["items"]} == {"alpha"}
                  assert beta["items"] and {row["tenant_id"] for row in beta["items"]} == {"beta"}
                  assert api_get("/orders?user_id=unknown-identity", expected=401)["error"] == "identity_not_found"
                  started = api_post("/workflows", {"user_id": "bob", "message": "apply an expense"}, expected=202)
                  assert started["run_id"].startswith("run-") and started["status"] == "waiting_fields"
                  assert api_get(f"/workflows/{started['run_id']}?user_id=diana", expected=404)["error"] == "run_not_found"
                  print("Installed wheel API service, tenant isolation and cross-identity run protection smoke passed")
              finally:
                  api_process.terminate()
                  api_process.wait(timeout=10)
          PY
